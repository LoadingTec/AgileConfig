# AgileConfig — Windows 上 Nginx 反向代理示例（入口端口 8538）
#
# 用法：解压官方 Windows 版 Nginx 后，将本文件复制为安装目录下的 conf\nginx.conf
#       （建议先备份原 conf\nginx.conf），再编辑 upstream 中的后端地址/端口。
#
# Windows 版说明：worker_processes 建议为 1；不要写 Linux 专用的 use epoll。

worker_processes  1;

error_log  logs/error.log  info;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        off;
    keepalive_timeout  65;

    # 后端 AgileConfig 节点（本机实践：默认 127.0.0.1:8050；多节点 HA 可取消注释并改 IP）
    upstream agileconfig_backend {
        least_conn;
        server 127.0.0.1:8050 max_fails=2 fail_timeout=30s;
        # server 127.0.0.1:8051 max_fails=2 fail_timeout=30s;
    }

    server {
        listen       8538;
        server_name  localhost;

        access_log  logs/agileconfig-8538.access.log;

        location / {
            proxy_pass http://agileconfig_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }
}
