# 独立运行用迷你配置：入口 8182；静态 + /api 反代。
# 启动：nginx -p C:/nginx-1.30.0/ -c <本文件绝对路径>
# 注意：include 须写 Nginx 安装目录下的 mime.types；勿写「mime.types」否则 Windows 会到本文件所在目录找 deploy/mime.types 而报错。
# 生产建议：合并进主 nginx.conf（http 内已有 mime.types，只追加 upstream + server 即可，见仓库主 conf）。

worker_processes  1;
error_log  C:/nginx-1.30.0/logs/error.balance-demo.log  warn;
pid        C:/nginx-1.30.0/logs/nginx.balance-demo.pid;

events { worker_connections  256; }
http {
    include       C:/nginx-1.30.0/conf/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream balance_demo_api {
        least_conn;
        server 127.0.0.1:5081 weight=1 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:5082 weight=1 max_fails=2 fail_timeout=5s;
    }

    server {
        listen       8182;
        server_name  localhost 192.168.201.51 _;

        # 静：HTML/CSS/JS/图片等由 Nginx 读磁盘，不经 Kestrel
        location / {
            root   C:/Users/Administrator/source/repos/AgileConfig/src/AgileConfig_Client/BalanceNgSvrApiHtml/static;
            index  index.html;
            try_files $uri $uri/ =404;
        }

        # 动：仅 API 进 ASP.NET Core；多实例时 upstream 做负载均衡
        location /api/ {
            proxy_pass         http://balance_demo_api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            client_max_body_size 20m;
        }
    }
}
