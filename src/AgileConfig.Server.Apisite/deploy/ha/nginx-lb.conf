# Nginx 负载均衡 - AgileConfig 高可用
# 用于内网或办公网对多个节点的统一入口
# 将本配置 include 到 nginx 的 http 或 server 块中

upstream agileconfig_backend {
    least_conn;  # 最少连接
    server 192.168.1.10:8050 max_fails=2 fail_timeout=30s;
    server 192.168.1.11:8050 max_fails=2 fail_timeout=30s;
    # 办公网节点（若 LB 能访问）
    # server 10.0.1.5:8050 max_fails=2 fail_timeout=30s;
}

server {
    listen 8050;
    server_name _;

    location / {
        proxy_pass http://agileconfig_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
