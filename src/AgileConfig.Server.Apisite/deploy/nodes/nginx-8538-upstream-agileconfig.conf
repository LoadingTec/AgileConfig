# 片段：合并到现有 nginx.conf 的 http { } 内（与 C:\nginx-1.30.0\conf\nginx.conf 中 upstream 定义一致）
# 三后端：主 8051 + 从 8052 + 从 8053；least_conn + max_fails 摘除不健康实例；proxy_next_upstream 在 502/503/504 时重试其它节点。

upstream agileconfig_nodes {
    least_conn;
    server 127.0.0.1:8051 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8052 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8053 max_fails=2 fail_timeout=10s;
}

# 在 server { ... } 内建议顺序与要点：
# - location ^~ /config/ui/：root+rewrite；rewrite ^/config/ui/$ → /ui/index.html 解决 GET /config/ui/（浏览器带 #/ 时）的 404
# - 第三条 rewrite 用 ^/config/ui/(.+)$ 而非 (.*)，避免「仅目录」被误改写成 /ui/ 后在个别环境下 index 不生效
# - 启动务必：nginx -p C:/nginx-1.30.0/ -c conf/nginx.conf（否则 CWD 下 conf 不含本段，/config/ui 会落到 htmls 404）
# - Windows：勿重复启动多个 master 同占 8538；netstat 若见多个 LISTENING，先 taskkill /F /IM nginx.exe 再只启动一次，否则客户端随机命中旧配置
# - /ui 与 /ui/*：301 到 /config/ui
# - location ^~ /config/ui/：本机静态（须比 ^~ /config/ 更长前缀）
# - UMI publicPath=/：根路径 umi.*.js|css、*.async.js、*.chunk.css、^~ /static/（logo 等）、/monaco-editor/ 须在 API 反代之前从 wwwroot/ui 出
# - 根路径 API：正则反代 upstream；Host 建议 $http_host；proxy_next_upstream 提升 LB 容错
# - location ^~ /config/：反代；proxy_pass 后不要加 URI（保留 /config/search 等完整路径）；proxy_redirect 把 /ui 改为 /config/ui
