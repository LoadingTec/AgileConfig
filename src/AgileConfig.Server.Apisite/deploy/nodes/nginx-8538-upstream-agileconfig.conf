# 片段：合并到现有 nginx.conf 的 http { } 内（与 C:\nginx-1.30.0\conf\nginx.conf 中 upstream 定义一致）
# 三后端：主 8051 + 从 8052 + 从 8053；/config/ 反代到 upstream，单节点故障时由 Nginx 摘除不健康后端。

upstream agileconfig_nodes {
    least_conn;
    server 127.0.0.1:8051 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8052 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8053 max_fails=2 fail_timeout=10s;
}

